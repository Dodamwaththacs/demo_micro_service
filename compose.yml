services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./postgres-init/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
      - postgres-data:/var/lib/postgresql/data

  eureka-server:
    build:
      context: ./EurekaServer
      dockerfile: Dockerfile
      args:
        - VERSION=${VERSION:-latest}
    image: eureka-server:${VERSION:-latest}
    container_name: eureka-server
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
      args:
        - VERSION=${VERSION:-latest}
    image: api-gateway:${VERSION:-latest}
    container_name: api-gateway
    environment:
        - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server

  order-service:
    build:
      context: ./OrderService
      dockerfile: Dockerfile
      args:
        - VERSION=${VERSION:-latest}
    image: order-service:${VERSION:-latest}
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - PAYMENT_SERVICE_URL=http://payment-service:8081/api/payments
      - PRODUCT_SERVICE_URL=http://product-service:8083/api/products
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/order_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      - eureka-server
      - postgres

  payment-service:
    build:
      context: ./PaymentService
      dockerfile: Dockerfile
      args:
        - VERSION=${VERSION:-latest}
    image: payment-service:${VERSION:-latest}
    container_name: payment-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/payment_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      - eureka-server
      - postgres

  product-service:
    build:
      context: ./ProductService
      dockerfile: Dockerfile
      args:
        - VERSION=${VERSION:-latest}
    image: product-service:${VERSION:-latest}
    container_name: product-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/product_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      - eureka-server
      - postgres

volumes:
  postgres-data:

networks:
  default:
    name: microservices-network