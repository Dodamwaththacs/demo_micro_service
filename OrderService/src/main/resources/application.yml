spring:
  application:
    name: OrderService
  datasource:
    url: jdbc:h2:mem:orderdb
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

server:
  port: 8082

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always

# environment variables

payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8081/api/payments}

product:
  service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8083/api/products}